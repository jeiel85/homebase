name: Mobile CI

# Unit tests + lint for the Android app on every PR that touches it or the shared wire fixtures.
# The .NET side of the same fixtures is pinned by ProtocolGoldenTests.
on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'docs/mobile-protocol/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      # Both distribution channels (DECISIONS M-33): github (in-app updater) and play (none).
      - name: Unit tests, lint, debug build
        working-directory: mobile
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testGithubDebugUnitTest testPlayDebugUnitTest lintGithubDebug lintPlayDebug assembleGithubDebug assemblePlayDebug

      # The Play build must not carry the self-updater: Play forbids apps that update themselves
      # outside Play. Checked on the merged manifest so a stray main/ entry fails the PR.
      - name: Play build has no self-update permission
        working-directory: mobile
        run: |
          P=app/build/intermediates/merged_manifests/playDebug/processPlayDebugManifest/AndroidManifest.xml
          G=app/build/intermediates/merged_manifests/githubDebug/processGithubDebugManifest/AndroidManifest.xml
          test -f "$P" && test -f "$G"
          if grep -q -e REQUEST_INSTALL_PACKAGES -e UpdateCheckJobService "$P"; then echo "updater leaked into the Play build"; exit 1; fi
          grep -q REQUEST_INSTALL_PACKAGES "$G"
