name: Mobile CI

# Unit tests + lint for the Android app on every PR that touches it or the shared wire fixtures.
# The .NET side of the same fixtures is pinned by ProtocolGoldenTests.
on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'docs/mobile-protocol/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      # Both distribution channels (DECISIONS M-33): github (in-app updater) and play (none).
      - name: Unit tests, lint, debug build
        working-directory: mobile
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testGithubDebugUnitTest testPlayDebugUnitTest lintGithubDebug lintPlayDebug assembleGithubDebug assemblePlayDebug

      # The Play build must not carry the self-updater: Play forbids apps that update themselves
      # outside Play. Checked on the merged manifest so a stray main/ entry fails the PR. Read as
      # XML elements, not grepped: a comment that only names them must not fail the PR (#77).
      - name: Play build has no self-update permission
        working-directory: mobile
        run: |
          P=app/build/intermediates/merged_manifests/playDebug/processPlayDebugManifest/AndroidManifest.xml
          G=app/build/intermediates/merged_manifests/githubDebug/processGithubDebugManifest/AndroidManifest.xml
          python3 - "$P" "$G" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          NAME = "{http://schemas.android.com/apk/res/android}name"
          PERMISSIONS = {
              "android.permission.REQUEST_INSTALL_PACKAGES",
              "android.permission.UPDATE_PACKAGES_WITHOUT_USER_ACTION",
              "android.permission.ENFORCE_UPDATE_OWNERSHIP",
          }
          COMPONENTS = {"UpdateCheckJobService", "UpdateInstallReceiver"}

          def updater(path):
              root = ET.parse(path).getroot()
              found = {e.get(NAME) for tag in ("uses-permission", "uses-permission-sdk-23") for e in root.iter(tag)} & PERMISSIONS
              for tag in ("service", "receiver"):
                  found |= {e.get(NAME) for e in root.iter(tag) if (e.get(NAME) or "").rsplit(".", 1)[-1] in COMPONENTS}
              return found

          play, github = updater(sys.argv[1]), updater(sys.argv[2])
          if play:
              sys.exit("updater leaked into the Play build: " + ", ".join(sorted(play)))
          if "android.permission.REQUEST_INSTALL_PACKAGES" not in github:
              sys.exit("the GitHub build lost its updater")
          PY
