name: .NET CI

# Build + unit tests for the Windows side (Agent, Tray, libraries) on every PR that touches it.
# release.yml runs the same tests before it publishes, so a broken merge can't reach the
# auto-updater. The mobile side has its own workflow (mobile-ci.yml).
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/mobile-protocol/**'
      - 'Directory.Build.props'
      - 'LocalOpsBot.sln'
      - '.github/workflows/dotnet-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '9.0'

      # The whole solution: the Tray (WPF) and its own tests compile too.
      - name: Build
        run: dotnet build LocalOpsBot.sln -c Release

      - name: Test
        run: dotnet test tests/LocalOpsBot.Tests/LocalOpsBot.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      # Tray windows (update flow) on a WPF dispatcher, #71.
      - name: Test (Tray)
        run: dotnet test tests/LocalOpsBot.Tray.Tests/LocalOpsBot.Tray.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
