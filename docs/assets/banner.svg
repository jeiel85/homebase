<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Homebase</title>
  <desc id="desc">자리를 비워도 PC는 손 안에 — Windows PC를 휴대폰에서 1초마다 보고, AI 세션 권한 요청에 알림으로 답하는 개인용 모니터링</desc>
  <!--
    Homebase "console" identity — the same palette as the phone app (mobile/.../ui/Theme.kt) and the tray
    (src/LocalOpsBot.Tray/Themes/HomebaseTheme.xaml): periwinkle canvas, carbon command slabs, amber/signal
    for wayfinding only. Depth is a hard chrome-indigo offset, not a soft shadow.
    Also the source of docs/assets/og.png (rendered 1:1 at 1200x630). Keep assets/ and docs/assets/ copies identical.
  -->
  <defs>
    <pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="6.5" cy="6.5" r="1.2" fill="#3D4F97" fill-opacity="0.32"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0.18">
      <stop offset="0.38" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="630">
      <rect width="1200" height="630" fill="url(#fade)"/>
    </mask>
    <clipPath id="bayClip">
      <rect x="700" y="128" width="444" height="244" rx="10"/>
    </clipPath>
    <!-- launcher icon house, mobile/app/src/main/res/drawable/ic_launcher_foreground.xml (108 viewport) -->
    <g id="house">
      <path d="M54,30 L30,52 L78,52 Z"/>
      <path d="M36,52 L72,52 L72,78 L36,78 Z"/>
    </g>
  </defs>

  <!-- Faceplate: periwinkle canvas with the dot field fading in to the right -->
  <rect width="1200" height="630" fill="#7A8ABA"/>
  <rect width="1200" height="630" fill="url(#dots)" mask="url(#dotMask)"/>

  <!-- Circuit traces behind the instruments -->
  <g fill="none" stroke="#3D4F97" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round">
    <path d="M622 150 H662 L682 130 H700"/>
    <path d="M1200 404 H1172 L1158 390 H1150"/>
    <path d="M600 600 H858 L874 584 H1060 L1076 600 H1200"/>
    <path d="M1170 128 V96 L1186 88"/>
  </g>
  <g fill="#3D4F97" fill-opacity="0.6">
    <circle cx="622" cy="150" r="4"/>
    <circle cx="600" cy="600" r="4"/>
  </g>

  <!-- Masthead: carbon slab closed by the amber stripe -->
  <rect width="1200" height="84" fill="#21242E"/>
  <rect y="84" width="1200" height="4" fill="#ECAB37"/>
  <rect x="56" y="18" width="48" height="48" rx="11" fill="#2E3240" stroke="#3A3F52" stroke-width="1.5"/>
  <use href="#house" fill="#ECAB37" transform="translate(80 42) scale(0.62) translate(-54 -54)"/>
  <g transform="translate(80 42) scale(0.62) translate(-54 -54)"><path d="M49,62 L59,62 L59,78 L49,78 Z" fill="#2E3240"/></g>
  <text x="122" y="53" font-family="'Arial Black', 'Arial', sans-serif" font-weight="900" font-size="29" letter-spacing="0.6" fill="#FFFFFF">HOMEBASE</text>

  <g transform="translate(990 24)">
    <rect width="154" height="36" rx="5" fill="#2E3240"/>
    <circle cx="20" cy="18" r="8" fill="#43C463" fill-opacity="0.22"/>
    <circle cx="20" cy="18" r="4.5" fill="#43C463"/>
    <text x="34" y="23.5" font-family="'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-weight="700" font-size="14" fill="#B4BEE2">PC 온라인</text>
    <text x="136" y="25" text-anchor="end" font-family="'Arial Black', 'Arial', sans-serif" font-weight="900" font-size="18" fill="#FFFFFF">3/3</text>
  </g>

  <!-- Left: the pitch -->
  <g font-family="'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" fill="#21242E">
    <rect x="56" y="141" width="18" height="4" fill="#ECAB37"/>
    <text x="84" y="150" font-size="18" font-weight="700" letter-spacing="0.3">개인용 Windows PC 모니터링</text>

    <text x="52" y="238" font-size="70" font-weight="800" letter-spacing="-2">자리를 비워도</text>
    <text x="52" y="320" font-size="70" font-weight="800" letter-spacing="-2">PC는 <tspan fill="#FFFFFF">손 안에</tspan></text>

    <text x="56" y="376" font-size="21" font-weight="600">CPU·GPU·온도를 휴대폰에서 1초마다 보고,</text>
    <text x="56" y="406" font-size="21" font-weight="600">AI 세션이 부르면 알림에서 바로 답합니다.</text>
  </g>

  <!-- Feature chips: carbon slabs, amber LED -->
  <g font-family="'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">
    <g transform="translate(56 444)">
      <rect width="164" height="40" rx="5" fill="#21242E"/>
      <circle cx="18" cy="20" r="4" fill="#ECAB37"/>
      <text x="32" y="26">종단 암호화 푸시</text>
    </g>
    <g transform="translate(232 444)">
      <rect width="150" height="40" rx="5" fill="#21242E"/>
      <circle cx="18" cy="20" r="4" fill="#ECAB37"/>
      <text x="32" y="26">열린 포트 없음</text>
    </g>
    <g transform="translate(394 444)">
      <rect width="208" height="40" rx="5" fill="#21242E"/>
      <circle cx="18" cy="20" r="4" fill="#ECAB37"/>
      <text x="32" y="26">Claude Code · Codex</text>
    </g>
  </g>

  <text x="56" y="566" font-family="Consolas, 'SF Mono', 'Cascadia Mono', ui-monospace, monospace" font-size="15" font-weight="700" fill="#21242E">jeiel85.github.io/homebase</text>

  <!-- Right: a PC bay, as on the phone's PC list -->
  <rect x="712" y="140" width="444" height="244" rx="10" fill="#3D4F97"/>
  <g clip-path="url(#bayClip)">
    <rect x="700" y="128" width="444" height="244" fill="#FFFFFF"/>
    <rect x="700" y="128" width="444" height="174" fill="#21242E"/>

    <g font-family="'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
      <circle cx="735" cy="162" r="14" fill="#1E63C6"/>
      <text x="735" y="167.5" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">작</text>
      <text x="758" y="171" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">작업실</text>
      <circle cx="1060" cy="162" r="8" fill="#43C463" fill-opacity="0.22"/>
      <circle cx="1060" cy="162" r="4.5" fill="#43C463"/>
      <text x="1074" y="167" font-family="'Arial Black', 'Arial', sans-serif" font-size="13" font-weight="900" fill="#B4BEE2" letter-spacing="1">LAN</text>
    </g>

    <!-- Meters: label + readout, then a 20-segment bar (periwinkle, amber from 75 %) -->
    <g font-family="'Arial', sans-serif" font-weight="700">
      <text x="722" y="210" font-size="12" letter-spacing="1" fill="#B4BEE2">CPU</text>
      <text x="910" y="211" text-anchor="end" font-family="'Arial Black', 'Arial', sans-serif" font-weight="900" font-size="15" fill="#FFFFFF">42%</text>
      <text x="934" y="210" font-size="12" letter-spacing="1" fill="#B4BEE2">MEM</text>
      <text x="1122" y="211" text-anchor="end" font-family="'Arial Black', 'Arial', sans-serif" font-weight="900" font-size="15" fill="#FFFFFF">61%</text>
      <text x="722" y="256" font-size="12" letter-spacing="1" fill="#B4BEE2">GPU</text>
      <text x="910" y="257" text-anchor="end" font-family="'Arial Black', 'Arial', sans-serif" font-weight="900" font-size="15" fill="#FFFFFF">78%</text>
      <text x="934" y="256" font-size="12" letter-spacing="1" fill="#B4BEE2">TEMP</text>
      <text x="1122" y="257" text-anchor="end" font-family="'Arial Black', 'Arial', sans-serif" font-weight="900" font-size="15" fill="#FFFFFF">64°C</text>
    </g>

    <!-- CPU 42 % → 8 of 20 -->
    <g transform="translate(722 220)">
      <g fill="#8BA1D4">
        <rect x="0" width="7.5" height="8" rx="1.5"/><rect x="9.5" width="7.5" height="8" rx="1.5"/><rect x="19" width="7.5" height="8" rx="1.5"/><rect x="28.5" width="7.5" height="8" rx="1.5"/>
        <rect x="38" width="7.5" height="8" rx="1.5"/><rect x="47.5" width="7.5" height="8" rx="1.5"/><rect x="57" width="7.5" height="8" rx="1.5"/><rect x="66.5" width="7.5" height="8" rx="1.5"/>
      </g>
      <g fill="#353A4A">
        <rect x="76" width="7.5" height="8" rx="1.5"/><rect x="85.5" width="7.5" height="8" rx="1.5"/><rect x="95" width="7.5" height="8" rx="1.5"/><rect x="104.5" width="7.5" height="8" rx="1.5"/>
        <rect x="114" width="7.5" height="8" rx="1.5"/><rect x="123.5" width="7.5" height="8" rx="1.5"/><rect x="133" width="7.5" height="8" rx="1.5"/><rect x="142.5" width="7.5" height="8" rx="1.5"/>
        <rect x="152" width="7.5" height="8" rx="1.5"/><rect x="161.5" width="7.5" height="8" rx="1.5"/><rect x="171" width="7.5" height="8" rx="1.5"/><rect x="180.5" width="7.5" height="8" rx="1.5"/>
      </g>
    </g>
    <!-- MEM 61 % → 12 of 20 -->
    <g transform="translate(934 220)">
      <g fill="#8BA1D4">
        <rect x="0" width="7.5" height="8" rx="1.5"/><rect x="9.5" width="7.5" height="8" rx="1.5"/><rect x="19" width="7.5" height="8" rx="1.5"/><rect x="28.5" width="7.5" height="8" rx="1.5"/>
        <rect x="38" width="7.5" height="8" rx="1.5"/><rect x="47.5" width="7.5" height="8" rx="1.5"/><rect x="57" width="7.5" height="8" rx="1.5"/><rect x="66.5" width="7.5" height="8" rx="1.5"/>
        <rect x="76" width="7.5" height="8" rx="1.5"/><rect x="85.5" width="7.5" height="8" rx="1.5"/><rect x="95" width="7.5" height="8" rx="1.5"/><rect x="104.5" width="7.5" height="8" rx="1.5"/>
      </g>
      <g fill="#353A4A">
        <rect x="114" width="7.5" height="8" rx="1.5"/><rect x="123.5" width="7.5" height="8" rx="1.5"/><rect x="133" width="7.5" height="8" rx="1.5"/><rect x="142.5" width="7.5" height="8" rx="1.5"/>
        <rect x="152" width="7.5" height="8" rx="1.5"/><rect x="161.5" width="7.5" height="8" rx="1.5"/><rect x="171" width="7.5" height="8" rx="1.5"/><rect x="180.5" width="7.5" height="8" rx="1.5"/>
      </g>
    </g>
    <!-- GPU 78 % → 16 of 20, amber (≥ 75 %) -->
    <g transform="translate(722 266)">
      <g fill="#ECAB37">
        <rect x="0" width="7.5" height="8" rx="1.5"/><rect x="9.5" width="7.5" height="8" rx="1.5"/><rect x="19" width="7.5" height="8" rx="1.5"/><rect x="28.5" width="7.5" height="8" rx="1.5"/>
        <rect x="38" width="7.5" height="8" rx="1.5"/><rect x="47.5" width="7.5" height="8" rx="1.5"/><rect x="57" width="7.5" height="8" rx="1.5"/><rect x="66.5" width="7.5" height="8" rx="1.5"/>
        <rect x="76" width="7.5" height="8" rx="1.5"/><rect x="85.5" width="7.5" height="8" rx="1.5"/><rect x="95" width="7.5" height="8" rx="1.5"/><rect x="104.5" width="7.5" height="8" rx="1.5"/>
        <rect x="114" width="7.5" height="8" rx="1.5"/><rect x="123.5" width="7.5" height="8" rx="1.5"/><rect x="133" width="7.5" height="8" rx="1.5"/><rect x="142.5" width="7.5" height="8" rx="1.5"/>
      </g>
      <g fill="#353A4A">
        <rect x="152" width="7.5" height="8" rx="1.5"/><rect x="161.5" width="7.5" height="8" rx="1.5"/><rect x="171" width="7.5" height="8" rx="1.5"/><rect x="180.5" width="7.5" height="8" rx="1.5"/>
      </g>
    </g>
    <!-- TEMP 64 °C → 13 of 20 -->
    <g transform="translate(934 266)">
      <g fill="#8BA1D4">
        <rect x="0" width="7.5" height="8" rx="1.5"/><rect x="9.5" width="7.5" height="8" rx="1.5"/><rect x="19" width="7.5" height="8" rx="1.5"/><rect x="28.5" width="7.5" height="8" rx="1.5"/>
        <rect x="38" width="7.5" height="8" rx="1.5"/><rect x="47.5" width="7.5" height="8" rx="1.5"/><rect x="57" width="7.5" height="8" rx="1.5"/><rect x="66.5" width="7.5" height="8" rx="1.5"/>
        <rect x="76" width="7.5" height="8" rx="1.5"/><rect x="85.5" width="7.5" height="8" rx="1.5"/><rect x="95" width="7.5" height="8" rx="1.5"/><rect x="104.5" width="7.5" height="8" rx="1.5"/>
        <rect x="114" width="7.5" height="8" rx="1.5"/>
      </g>
      <g fill="#353A4A">
        <rect x="123.5" width="7.5" height="8" rx="1.5"/><rect x="133" width="7.5" height="8" rx="1.5"/><rect x="142.5" width="7.5" height="8" rx="1.5"/>
        <rect x="152" width="7.5" height="8" rx="1.5"/><rect x="161.5" width="7.5" height="8" rx="1.5"/><rect x="171" width="7.5" height="8" rx="1.5"/><rect x="180.5" width="7.5" height="8" rx="1.5"/>
      </g>
    </g>

    <!-- AI session row on the white plate -->
    <g font-family="'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
      <circle cx="727" cy="337" r="9" fill="#ECAB37" fill-opacity="0.25"/>
      <circle cx="727" cy="337" r="5" fill="#ECAB37"/>
      <text x="746" y="332" font-size="17" font-weight="700" fill="#21242E">Claude Code · 입력 대기</text>
      <text x="746" y="355" font-size="14" font-weight="600" fill="#4A5180">homebase · 권한 요청 1건 · 2분째</text>
      <text x="1122" y="346" text-anchor="end" font-family="'Arial', sans-serif" font-size="26" font-weight="700" fill="#4A5180">›</text>
    </g>
  </g>

  <!-- Android heads-up notification with Allow / Deny -->
  <rect x="660" y="420" width="470" height="148" rx="20" fill="#3D4F97"/>
  <rect x="650" y="410" width="470" height="148" rx="20" fill="#FFFFFF"/>
  <g font-family="'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <use href="#house" fill="#ECAB37" transform="translate(680 437) scale(0.27) translate(-54 -54)"/>
    <text x="694" y="442" font-size="13" font-weight="600" fill="#5B6178">Homebase · 작업실 · Claude Code · 지금</text>
    <text x="674" y="474" font-size="18" font-weight="800" fill="#21242E">권한 요청 — 명령 실행</text>
    <text x="674" y="498" font-family="Consolas, 'SF Mono', 'Cascadia Mono', ui-monospace, monospace" font-size="14" font-weight="700" fill="#4A5180">dotnet test LocalOpsBot.sln</text>
    <circle cx="1080" cy="466" r="19" fill="#1E63C6"/>
    <text x="1080" y="472" text-anchor="middle" font-size="17" font-weight="800" fill="#FFFFFF">작</text>

    <rect x="674" y="512" width="98" height="34" rx="6" fill="#B8620E"/>
    <rect x="674" y="510" width="98" height="34" rx="6" fill="#F68D1F"/>
    <text x="723" y="532" text-anchor="middle" font-size="15" font-weight="800" fill="#21242E">허용</text>
    <rect x="784.75" y="510.75" width="96.5" height="32.5" rx="6" fill="none" stroke="#4A5180" stroke-width="1.5"/>
    <text x="833" y="532" text-anchor="middle" font-size="15" font-weight="800" fill="#21242E">거부</text>
  </g>
</svg>
